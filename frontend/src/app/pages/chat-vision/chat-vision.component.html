<div class="card">
  <div class="card-title">Multi-Modal AI Assistant (Text, Voice STT/TTS & Vision Document OCR)</div>
  
  <div style="display:flex; gap:10px; margin-bottom:16px;">
    <input type="text" [(ngModel)]="userQuery" style="flex:1; background:var(--bg-dark); border:1px solid var(--card-border); color:#fff; padding:10px; border-radius:6px;" placeholder="Ask about project risks or SOW policy compliance...">
    <button class="btn" (click)="sendQuery()">Send Query</button>
    <button class="btn btn-secondary" (click)="startVoice()">{{ isRecordingVoice ? '🎙 Listening...' : '🎤 Voice Input' }}</button>
    
    <label class="btn btn-secondary" style="cursor:pointer; display:inline-block;">
      📷 OCR Vision Upload
      <input type="file" (change)="onFileSelected($event)" style="display:none;" accept="image/*,.pdf,.txt,.doc,.docx">
    </label>
  </div>

  <div *ngIf="selectedFileName" style="margin-bottom:12px; font-size:12px; color:var(--success);">
    📄 Uploaded for OCR Vision Analysis: <strong>{{ selectedFileName }}</strong>
  </div>

  <div style="background:var(--bg-dark); border:1px solid var(--card-border); padding:16px; border-radius:8px; min-height:200px;">
    <p style="color:var(--success); font-weight:bold;">[Chat Supervisor Agent Response]</p>
    <p style="margin-top:8px;">{{ chatResponse || 'Enter a prompt, use voice input, or upload a document for OCR Vision analysis...' }}</p>
  </div>
</div>
